name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/check_dist.py
      - run: python3 -I tests/test_check_dist.py
