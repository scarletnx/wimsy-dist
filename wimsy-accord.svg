<?xml version="1.0" encoding="UTF-8"?>
<!-- Wimsy (Liz, ScarletNX's dist/wimsy.svg, GPL-3.0-or-later) with Accord's rope and cross and colours.
     The leaves keep Wimsy's own shapes; the colours and the shapes of Accord's mark, accord.dravee.dev/assets/img/logo.svg; fan art. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512"
     viewBox="0 0 512 512" fill="none">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <cc:Work rdf:about="">
        <dc:title>Wimsy with Accord's rope and cross</dc:title>
        <dc:creator><cc:Agent><dc:title>Liz (Wimsy)</dc:title></cc:Agent></dc:creator>
        <dc:contributor><cc:Agent><dc:title>AO55 (rope and cross, Accord's colours)</dc:title></cc:Agent></dc:contributor>
        <dc:license rdf:resource="https://spdx.org/licenses/GPL-3.0-or-later.html"/>
        <dc:source>https://github.com/scarletnx/ScarletNX/blob/main/dist/wimsy.svg</dc:source>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <!-- Accord: black hair, sleeves and leaves below, a white front, the rope of its mark on the trim, its cross on the arm -->
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E5E5E"/>
      <stop offset="1" stop-color="#010101"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#010101"/>
    </linearGradient>
    <linearGradient id="tail-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#010101"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#010101"/>
    </linearGradient>
    <linearGradient id="far-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="outfit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D1D1D1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4F5"/>
      <stop offset="1" stop-color="#D3CCCF"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7D9CE"/>
      <stop offset="1" stop-color="#FDEDE6"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#9F9F9F"/>
      <stop offset="0.7" stop-color="#5E5E5E"/>
      <stop offset="1" stop-color="#010101"/>
    </radialGradient>
    <!-- Wimsy's head, as the original draws it -->
    <path id="head" d="M 508.04553,190.77006 A 330.76661,330.76661 0 0 0 355.34995,220.08038 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 382.15852,323.1017 244.08293,244.08293 0 0 0 508.04553,190.77006 Z"/>
    <clipPath id="head-clip"><use xlink:href="#head"/></clipPath>

    <!-- a drill pointing down from its tie at 0,0, drawn as Wimsy's leaves are: each turn of the ringlet a leaf of two
         arcs with a white edge, slanted as a helix winds, the turns narrowing to a curled tip, nothing between one turn and the next -->
    <!-- no tail: the head's back and the two leaves below, black as the mark's disc -->
  </defs>


  <!-- the wings in the outfit's grey -->
  <path fill="#010101" stroke="#FFFFFF" stroke-width="5.47474"
        d="M 192.28931,12.793038 A 330.76661,330.76661 0 0 0 161.77932,165.25345 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 267.29749,179.3252 244.08293,244.08293 0 0 0 192.28931,12.793038 Z"/>
  <path fill="url(#outfit)" stroke="#FFFFFF" stroke-width="5.47474"
        d="M 283.32464,18.471579 A 330.76661,330.76661 0 0 0 211.63417,156.44085 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 309.08124,199.29137 244.08293,244.08293 0 0 0 283.32464,18.471579 Z"/>
  <!-- the outfit's rope trim along the front wing -->
  <path fill="none" stroke="#010101" stroke-width="10" stroke-linecap="round"
        d="M 279,40 C 246,92 226,170 224,300"/>

  <!-- the rope of Accord's mark on the trim: white leaves slanted across it -->
  <g transform="translate(274.15,48.00) rotate(170.1) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(271.24,53.17) rotate(168.7) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(268.40,58.50) rotate(167.3) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(265.65,64.00) rotate(165.9) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(262.97,69.67) rotate(164.6) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(260.37,75.51) rotate(163.3) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(257.86,81.54) rotate(162.0) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(255.42,87.76) rotate(160.8) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(253.07,94.16) rotate(159.6) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(250.81,100.76) rotate(158.4) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(248.62,107.56) rotate(157.2) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(246.53,114.56) rotate(156.1) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(244.52,121.77) rotate(155.0) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(242.59,129.20) rotate(154.0) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(240.76,136.84) rotate(153.0) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(239.01,144.71) rotate(152.0) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(237.36,152.81) rotate(151.1) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(235.79,161.13) rotate(150.2) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(234.32,169.70) rotate(149.3) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(232.94,178.51) rotate(148.5) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(231.65,187.56) rotate(147.7) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(230.46,196.86) rotate(146.9) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(229.36,206.42) rotate(146.2) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(228.36,216.24) rotate(145.5) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(227.46,226.33) rotate(144.8) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(226.66,236.68) rotate(144.1) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(225.95,247.31) rotate(143.5) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(225.34,258.22) rotate(142.9) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(224.84,269.41) rotate(142.3) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <g transform="translate(224.43,280.89) rotate(141.7) translate(-4.6,0)"><path fill="#FFFFFF" d="M 0,0 A 7.07,7.07 0 0 1 9.2,0 A 7.07,7.07 0 0 1 0,0 Z"/></g>
  <!-- Accord's cross on the arm: four leaves from one point, a dot between each two -->
  <g transform="rotate(-8 192 100)"><g transform="translate(196,100)"><g transform="rotate(0)"><path fill="#FFFFFF" d="M 0,0 A 7.05,7.05 0 0 1 11,0 A 7.05,7.05 0 0 1 0,0 Z"/></g><g transform="rotate(90)"><path fill="#FFFFFF" d="M 0,0 A 7.05,7.05 0 0 1 11,0 A 7.05,7.05 0 0 1 0,0 Z"/></g><g transform="rotate(180)"><path fill="#FFFFFF" d="M 0,0 A 7.05,7.05 0 0 1 11,0 A 7.05,7.05 0 0 1 0,0 Z"/></g><g transform="rotate(270)"><path fill="#FFFFFF" d="M 0,0 A 7.05,7.05 0 0 1 11,0 A 7.05,7.05 0 0 1 0,0 Z"/></g><circle cx="4.82" cy="4.82" r="1.43" fill="#FFFFFF"/><circle cx="-4.82" cy="4.82" r="1.43" fill="#FFFFFF"/><circle cx="-4.82" cy="-4.82" r="1.43" fill="#FFFFFF"/><circle cx="4.82" cy="-4.82" r="1.43" fill="#FFFFFF"/></g></g>
  <!-- the two leaves below, in the hair's black -->
  <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="3.64433"
        d="M 3.1326032,310.41929 A 220.1792,220.1792 0 0 0 98.555722,350.50134 220.1792,220.1792 0 0 0 217.7827,336.65055 162.47705,162.47705 0 0 0 121.7011,283.52647 162.47705,162.47705 0 0 0 3.1326032,310.41929 Z"/>
  <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="3.64433"
        d="M 80.650839,503.85583 A 220.1792,220.1792 0 0 0 165.61247,444.74858 220.1792,220.1792 0 0 0 217.7827,336.65055 162.47705,162.47705 0 0 0 121.45529,389.32762 162.47705,162.47705 0 0 0 80.650839,503.85583 Z"/>

  <!-- the head: a face, the hair over its back and its top in bangs, a blush -->
  <use xlink:href="#head" fill="url(#skin)"/>
  <g clip-path="url(#head-clip)">
    <g transform="translate(217.8,336.7) rotate(-26.68)">
      <path fill="url(#hair)"
            d="M -40,-200 L 340,-200 L 340,-40 L 300,-36 L 274,-8 L 258,-32 L 222,-28 L 194,-4 L 178,-30 L 134,-28 L 114,28 L 102,90 L -40,90 Z"/>
      <path fill="none" stroke="#D1D1D1" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"
            d="M 40,-30 C 70,-40 110,-44 150,-40"/>
      <ellipse cx="160" cy="34" rx="15" ry="7" fill="#F28C9C" fill-opacity="0.6"/>
      <ellipse cx="236" cy="34" rx="12" ry="6" fill="#F28C9C" fill-opacity="0.6"/>
    </g>
  </g>
  <use xlink:href="#head" stroke="#FFFFFF" stroke-width="5.47474"/>

  <!-- the eyes, where Wimsy has them, black, with the round glint -->
  <g transform="rotate(24.165289)">
    <circle cx="434.99091" cy="99.701668" r="23.114985" fill="#010101"/>
    <circle cx="434.99" cy="96.20" r="17.5" fill="url(#iris)"/>
    <circle cx="430.39" cy="89.40" r="7" fill="#FFFFFF"/>
    <circle cx="440.39" cy="103.60" r="3" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="485.51288" cy="44.356552" r="23.114985" fill="#010101"/>
    <circle cx="485.51" cy="40.86" r="17.5" fill="url(#iris)"/>
    <circle cx="480.91" cy="34.06" r="7" fill="#FFFFFF"/>
    <circle cx="490.91" cy="48.26" r="3" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

