<!-- Wimsy (Liz, ScarletNX's dist/wimsy.svg, GPL-3.0-or-later) with GUMI's short hair and goggles and colours.
     The leaves keep Wimsy's own shapes; colours from the Megpoid V4 box; fan art. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512"
     viewBox="0 0 512 512" fill="none">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <cc:Work rdf:about="">
        <dc:title>Wimsy with GUMI's short hair and goggles</dc:title>
        <dc:creator><cc:Agent><dc:title>Liz (Wimsy)</dc:title></cc:Agent></dc:creator>
        <dc:contributor><cc:Agent><dc:title>AO55 (short hair and goggles, GUMI's colours)</dc:title></cc:Agent></dc:contributor>
        <dc:license rdf:resource="https://spdx.org/licenses/CC-BY-NC-SA-4.0.html"/>
        <dc:source>https://github.com/scarletnx/ScarletNX/blob/main/dist/wimsy.svg</dc:source>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <!-- GUMI: green hair and its shade, green eyes, a white top, an orange vest with red-orange trim -->
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86D46E"/>
      <stop offset="1" stop-color="#4DAE5C"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ACB6A"/>
      <stop offset="1" stop-color="#3E9E58"/>
    </linearGradient>
    <linearGradient id="tail-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DAE5C"/>
      <stop offset="1" stop-color="#2E7F44"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DAE5C"/>
      <stop offset="1" stop-color="#2E7F44"/>
    </linearGradient>
    <linearGradient id="far-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E9450"/>
      <stop offset="1" stop-color="#256A38"/>
    </linearGradient>
    <linearGradient id="outfit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F7F1"/>
      <stop offset="1" stop-color="#DCD9CC"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4F5"/>
      <stop offset="1" stop-color="#D3CCCF"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7D9CE"/>
      <stop offset="1" stop-color="#FDEDE6"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#A8E07A"/>
      <stop offset="0.7" stop-color="#4E9A2E"/>
      <stop offset="1" stop-color="#26561A"/>
    </radialGradient>
    <!-- Wimsy's head, as the original draws it -->
    <path id="head" d="M 508.04553,190.77006 A 330.76661,330.76661 0 0 0 355.34995,220.08038 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 382.15852,323.1017 244.08293,244.08293 0 0 0 508.04553,190.77006 Z"/>
    <clipPath id="head-clip"><use xlink:href="#head"/></clipPath>

    <!-- a drill pointing down from its tie at 0,0, drawn as Wimsy's leaves are: each turn of the ringlet a leaf of two
         arcs with a white edge, slanted as a helix winds, the turns narrowing to a curled tip, nothing between one turn and the next -->
    <!-- her long lock beside the face: one leaf, untied -->
    <g id="drill">
      <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" d="M -22,6 Q -42,120 2,236 Q 34,118 22,6 Q 0,-6 -22,6 Z"/>
    </g>
  </defs>


  <!-- the wings in the outfit's grey -->
  <path fill="#EE8A2A" stroke="#FFFFFF" stroke-width="5.47474"
        d="M 192.28931,12.793038 A 330.76661,330.76661 0 0 0 161.77932,165.25345 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 267.29749,179.3252 244.08293,244.08293 0 0 0 192.28931,12.793038 Z"/>
  <path fill="url(#outfit)" stroke="#FFFFFF" stroke-width="5.47474"
        d="M 283.32464,18.471579 A 330.76661,330.76661 0 0 0 211.63417,156.44085 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 309.08124,199.29137 244.08293,244.08293 0 0 0 283.32464,18.471579 Z"/>
  <!-- the outfit's orange trim along the front wing -->
  <path fill="none" stroke="#E2562E" stroke-width="5" stroke-linecap="round"
        d="M 279,40 C 246,92 226,170 224,300"/>

  <!-- the two leaves below, in the hair's green -->
  <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="3.64433"
        d="M 3.1326032,310.41929 A 220.1792,220.1792 0 0 0 98.555722,350.50134 220.1792,220.1792 0 0 0 217.7827,336.65055 162.47705,162.47705 0 0 0 121.7011,283.52647 162.47705,162.47705 0 0 0 3.1326032,310.41929 Z"/>
  <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="3.64433"
        d="M 80.650839,503.85583 A 220.1792,220.1792 0 0 0 165.61247,444.74858 220.1792,220.1792 0 0 0 217.7827,336.65055 162.47705,162.47705 0 0 0 121.45529,389.32762 162.47705,162.47705 0 0 0 80.650839,503.85583 Z"/>

  <!-- the head: a face, the hair over its back and its top in bangs, a blush -->
  <use xlink:href="#head" fill="url(#skin)"/>
  <g clip-path="url(#head-clip)">
    <g transform="translate(217.8,336.7) rotate(-26.68)">
      <path fill="url(#hair)"
            d="M -40,-200 L 340,-200 L 340,-40 L 300,-36 L 274,-8 L 258,-32 L 222,-28 L 194,-4 L 178,-30 L 134,-28 L 114,28 L 102,90 L -40,90 Z"/>
      <path fill="none" stroke="#D6F5B8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"
            d="M 40,-30 C 70,-40 110,-44 150,-40"/>
      <ellipse cx="160" cy="34" rx="15" ry="7" fill="#F28C9C" fill-opacity="0.6"/>
      <ellipse cx="236" cy="34" rx="12" ry="6" fill="#F28C9C" fill-opacity="0.6"/>
    </g>
  </g>
  <use xlink:href="#head" stroke="#FFFFFF" stroke-width="5.47474"/>

  <!-- her red goggles up on her head, on their strap -->
  <g transform="translate(217.8,336.7) rotate(-26.68)">
    <path stroke="#3A2A26" stroke-width="7" stroke-linecap="round" fill="none" d="M 96,-34 Q 156,-56 220,-44"/>
    <rect x="118" y="-66" width="82" height="34" rx="16" fill="#3A2A26" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="139" cy="-49" r="13" fill="#E03A2E"/>
    <circle cx="179" cy="-49" r="13" fill="#E03A2E"/>
    <path fill="#FFFFFF" fill-opacity="0.75" d="M 131,-55 Q 136,-60 142,-58 Q 136,-56 133,-51 Z M 171,-55 Q 176,-60 182,-58 Q 176,-56 173,-51 Z"/>
  </g>
  <!-- the eyes, where Wimsy has them, GUMI's green -->
  <g transform="rotate(24.165289)">
    <circle cx="434.99091" cy="99.701668" r="23.114985" fill="#1E3A18"/>
    <circle cx="434.99" cy="96.20" r="17.5" fill="url(#iris)"/>
    <circle cx="430.39" cy="89.40" r="7" fill="#FFFFFF"/>
    <circle cx="440.39" cy="103.60" r="3" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="485.51288" cy="44.356552" r="23.114985" fill="#1E3A18"/>
    <circle cx="485.51" cy="40.86" r="17.5" fill="url(#iris)"/>
    <circle cx="480.91" cy="34.06" r="7" fill="#FFFFFF"/>
    <circle cx="490.91" cy="48.26" r="3" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <!-- the lock beside her face, in front -->
  <use xlink:href="#drill" transform="translate(326,322) rotate(-12) scale(0.7,0.45)"/>
</svg>
