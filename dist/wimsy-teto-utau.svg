<?xml version="1.0" encoding="UTF-8"?>
<!-- Wimsy (Liz, ScarletNX's dist/wimsy.svg, GPL-3.0-or-later) with Kasane Teto's twin drills and colours.
     The leaves keep Wimsy's own shapes; fan art. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512"
     viewBox="0 0 512 512" fill="none">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <cc:Work rdf:about="">
        <dc:title>Wimsy with twin drills</dc:title>
        <dc:creator><cc:Agent><dc:title>Liz (Wimsy)</dc:title></cc:Agent></dc:creator>
        <dc:contributor><cc:Agent><dc:title>AO55 (twin drills, Kasane Teto's colours)</dc:title></cc:Agent></dc:contributor>
        <dc:license rdf:resource="https://spdx.org/licenses/GPL-3.0-or-later.html"/>
        <dc:source>https://github.com/scarletnx/ScarletNX/blob/main/dist/wimsy.svg</dc:source>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <!-- Teto: crimson hair and its shade, red eyes, a near-black grey outfit with red trim -->
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4485F"/>
      <stop offset="1" stop-color="#B92A41"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6334C"/>
      <stop offset="1" stop-color="#A3263A"/>
    </linearGradient>
    <linearGradient id="tail-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B92A41"/>
      <stop offset="1" stop-color="#8E2033"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B42C42"/>
      <stop offset="1" stop-color="#8A2032"/>
    </linearGradient>
    <linearGradient id="far-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A2438"/>
      <stop offset="1" stop-color="#701828"/>
    </linearGradient>
    <linearGradient id="outfit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E5E69"/>
      <stop offset="1" stop-color="#41414A"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7D9CE"/>
      <stop offset="1" stop-color="#FDEDE6"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#F2546B"/>
      <stop offset="0.7" stop-color="#C51F3A"/>
      <stop offset="1" stop-color="#8A1427"/>
    </radialGradient>
    <!-- Wimsy's head, as the original draws it -->
    <path id="head" d="M 508.04553,190.77006 A 330.76661,330.76661 0 0 0 355.34995,220.08038 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 382.15852,323.1017 244.08293,244.08293 0 0 0 508.04553,190.77006 Z"/>
    <clipPath id="head-clip"><use xlink:href="#head"/></clipPath>

    <!-- a drill pointing down from its tie at 0,0, drawn as Wimsy's leaves are: each turn of the ringlet a leaf of two
         arcs with a white edge, slanted as a helix winds, the turns narrowing to a curled tip, nothing between one turn and the next -->
    <g id="drill-turns">
      <path id="drill-turn-0" d="M -46,31.1 Q 0,-15.6 46,8.1 Q 0,72.4 -46,31.1 Z"/>
      <path id="drill-turn-1" d="M -40,77.2 Q 0,36.8 40,57.2 Q 0,112.8 -40,77.2 Z"/>
      <path id="drill-turn-2" d="M -33,117.0 Q 0,83.2 33,100.5 Q 0,147.2 -33,117.0 Z"/>
      <path id="drill-turn-3" d="M -26,150.9 Q 0,123.6 26,137.9 Q 0,175.6 -26,150.9 Z"/>
      <path id="drill-turn-4" d="M -19,178.8 Q 0,158.0 19,169.2 Q 0,198.0 -19,178.8 Z"/>
      <path id="drill-turn-5" d="M -10,194.0 Q 2,188.0 12,192.0 Q 14,214.0 24,228.0 Q -4,222.0 -10,194.0 Z"/>
    </g>
    <g id="drill">
      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round">
      <use xlink:href="#drill-turn-0" fill="url(#tail)"/>
      <use xlink:href="#drill-turn-1" fill="url(#tail-dark)"/>
      <use xlink:href="#drill-turn-2" fill="url(#tail)"/>
      <use xlink:href="#drill-turn-3" fill="url(#tail-dark)"/>
      <use xlink:href="#drill-turn-4" fill="url(#tail)"/>
      <use xlink:href="#drill-turn-5" fill="url(#tail-dark)"/>
      </g>
      <!-- the tie: the outfit's grey, a red band -->
      <rect x="-32" y="-8" width="64" height="16" rx="8" fill="#3B3B40" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="-25" y="-2" width="50" height="4" rx="2" fill="#D6334C"/>
    </g>
    <g id="drill-far">
      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round">
      <use xlink:href="#drill-turn-0" fill="url(#far)"/>
      <use xlink:href="#drill-turn-1" fill="url(#far-dark)"/>
      <use xlink:href="#drill-turn-2" fill="url(#far)"/>
      <use xlink:href="#drill-turn-3" fill="url(#far-dark)"/>
      <use xlink:href="#drill-turn-4" fill="url(#far)"/>
      <use xlink:href="#drill-turn-5" fill="url(#far-dark)"/>
      </g>
      <!-- the tie: the outfit's grey, a red band -->
      <rect x="-32" y="-8" width="64" height="16" rx="8" fill="#3B3B40" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="-25" y="-2" width="50" height="4" rx="2" fill="#D6334C"/>
    </g>
  </defs>

  <!-- the far drill, behind the head, in darker crimsons -->
  <use xlink:href="#drill-far" transform="translate(256,300) rotate(5) scale(0.62,0.48)"/>

  <!-- Teto's curl on top of the head, its root under it -->
  <path transform="translate(217.8,336.7) rotate(-26.68)" fill="url(#hair)" stroke="#FFFFFF" stroke-width="4"
        stroke-linejoin="round"
        d="M 126,-38 C 110,-100 180,-126 196,-88 C 204,-68 184,-54 172,-66 C 180,-78 168,-96 150,-86 C 136,-78 138,-56 142,-38 Z"/>

  <!-- the wings in the outfit's grey -->
  <path fill="#3B3B40" stroke="#FFFFFF" stroke-width="5.47474"
        d="M 192.28931,12.793038 A 330.76661,330.76661 0 0 0 161.77932,165.25345 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 267.29749,179.3252 244.08293,244.08293 0 0 0 192.28931,12.793038 Z"/>
  <path fill="url(#outfit)" stroke="#FFFFFF" stroke-width="5.47474"
        d="M 283.32464,18.471579 A 330.76661,330.76661 0 0 0 211.63417,156.44085 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 309.08124,199.29137 244.08293,244.08293 0 0 0 283.32464,18.471579 Z"/>
  <!-- the outfit's red trim along the front wing -->
  <path fill="none" stroke="#D6334C" stroke-width="4" stroke-linecap="round"
        d="M 279,40 C 246,92 226,170 224,300"/>

  <!-- the mark on her arm -->
  <g transform="rotate(-8 192 100) translate(186,92)" stroke="#D6334C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path transform="translate(0,0)" d="M 4,0 A 4,8 0 1 1 4,16 A 4,8 0 1 1 4,0"/>
    <path transform="translate(12,0)" d="M 6,16 L 6,0 L 0,11 L 8,11"/>
  </g>
  <!-- the two leaves below, in crimson -->
  <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="3.64433"
        d="M 3.1326032,310.41929 A 220.1792,220.1792 0 0 0 98.555722,350.50134 220.1792,220.1792 0 0 0 217.7827,336.65055 162.47705,162.47705 0 0 0 121.7011,283.52647 162.47705,162.47705 0 0 0 3.1326032,310.41929 Z"/>
  <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="3.64433"
        d="M 80.650839,503.85583 A 220.1792,220.1792 0 0 0 165.61247,444.74858 220.1792,220.1792 0 0 0 217.7827,336.65055 162.47705,162.47705 0 0 0 121.45529,389.32762 162.47705,162.47705 0 0 0 80.650839,503.85583 Z"/>

  <!-- the head: a face, the hair over its back and its top in bangs, a blush -->
  <use xlink:href="#head" fill="url(#skin)"/>
  <g clip-path="url(#head-clip)">
    <g transform="translate(217.8,336.7) rotate(-26.68)">
      <path fill="url(#hair)"
            d="M -40,-200 L 340,-200 L 340,-40 L 300,-36 L 274,-8 L 258,-32 L 222,-28 L 194,-4 L 178,-30 L 134,-28 L 114,28 L 102,90 L -40,90 Z"/>
      <path fill="none" stroke="#F48A9B" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"
            d="M 40,-30 C 70,-40 110,-44 150,-40"/>
      <ellipse cx="160" cy="34" rx="15" ry="7" fill="#F28C9C" fill-opacity="0.6"/>
      <ellipse cx="236" cy="34" rx="12" ry="6" fill="#F28C9C" fill-opacity="0.6"/>
    </g>
  </g>
  <use xlink:href="#head" stroke="#FFFFFF" stroke-width="5.47474"/>

  <!-- the eyes, where Wimsy has them, Teto's red -->
  <g transform="rotate(24.165289)">
    <circle cx="434.99091" cy="99.701668" r="23.114985" fill="#2B0A12"/>
    <circle cx="434.99091" cy="96.2" r="17.5" fill="url(#iris)"/>
    <circle cx="430.4" cy="89.4" r="7" fill="#FFFFFF"/>
    <circle cx="440.4" cy="103.6" r="3" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="485.51288" cy="44.356552" r="23.114985" fill="#2B0A12"/>
    <circle cx="485.51288" cy="40.9" r="17.5" fill="url(#iris)"/>
    <circle cx="480.9" cy="34.1" r="7" fill="#FFFFFF"/>
    <circle cx="490.9" cy="48.3" r="3" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <!-- the near drill, in front -->
  <use xlink:href="#drill" transform="translate(322,320) rotate(-10) scale(0.66,0.5)"/>
</svg>
