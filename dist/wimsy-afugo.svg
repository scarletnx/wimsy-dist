<!-- Wimsy (Liz, ScarletNX's dist/wimsy.svg, GPL-3.0-or-later) with Afugo's messy long rust hair and a clip and colours.
     The leaves keep Wimsy's own shapes; colours from Afugo's drawing on accord.dravee.dev, drawn by Kedr (Kedr_bit on X); fan art. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512"
     viewBox="0 0 512 512" fill="none">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <cc:Work rdf:about="">
        <dc:title>Wimsy with Afugo's messy long rust hair and a clip</dc:title>
        <dc:creator><cc:Agent><dc:title>Liz (Wimsy)</dc:title></cc:Agent></dc:creator>
        <dc:contributor><cc:Agent><dc:title>AO55 (messy long rust hair and a clip, Afugo's colours)</dc:title></cc:Agent></dc:contributor>
        <dc:license rdf:resource="https://spdx.org/licenses/CC-BY-NC-SA-4.0.html"/>
        <dc:source>https://github.com/scarletnx/ScarletNX/blob/main/dist/wimsy.svg</dc:source>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <!-- Afugo: long messy rust hair and its shade, two spikes on top, a lilac grey top with rust trim, dusky lilac sleeves with 51, tired rust eyes with lilac bags, a yawn, a black clip with AF in white -->
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DA7450"/>
      <stop offset="1" stop-color="#B84E33"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CF6545"/>
      <stop offset="1" stop-color="#9E3E27"/>
    </linearGradient>
    <linearGradient id="tail-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5502F"/>
      <stop offset="1" stop-color="#86331F"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B85236"/>
      <stop offset="1" stop-color="#8E3A26"/>
    </linearGradient>
    <linearGradient id="far-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A4029"/>
      <stop offset="1" stop-color="#6E2A1A"/>
    </linearGradient>
    <linearGradient id="outfit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EFF4"/>
      <stop offset="1" stop-color="#C9C1CF"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4F5"/>
      <stop offset="1" stop-color="#D3CCCF"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7D9CE"/>
      <stop offset="1" stop-color="#FDEDE6"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#E79A72"/>
      <stop offset="0.7" stop-color="#B5502F"/>
      <stop offset="1" stop-color="#5F2A1A"/>
    </radialGradient>
    <!-- Wimsy's head, as the original draws it -->
    <path id="head" d="M 508.04553,190.77006 A 330.76661,330.76661 0 0 0 355.34995,220.08038 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 382.15852,323.1017 244.08293,244.08293 0 0 0 508.04553,190.77006 Z"/>
    <clipPath id="head-clip"><use xlink:href="#head"/></clipPath>

    <!-- a drill pointing down from its tie at 0,0, drawn as Wimsy's leaves are: each turn of the ringlet a leaf of two
         arcs with a white edge, slanted as a helix winds, the turns narrowing to a curled tip, nothing between one turn and the next -->
    <!-- her long hair, loose: the head's back and the two leaves below, no tail -->
  </defs>


  <!-- Afugo's curl on top of the head, its root under it -->
  <path transform="translate(217.8,336.7) rotate(-26.68)" fill="url(#hair)" stroke="#FFFFFF" stroke-width="4"
        stroke-linejoin="round"
        d="M 150,-30 C 148,-96 196,-128 246,-120 C 208,-108 188,-80 190,-32 Z M 206,-34 C 210,-62 236,-76 266,-72 C 244,-64 230,-54 228,-34 Z"/>

  <!-- the wings in the outfit's grey -->
  <path fill="#8F8099" stroke="#FFFFFF" stroke-width="5.47474"
        d="M 192.28931,12.793038 A 330.76661,330.76661 0 0 0 161.77932,165.25345 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 267.29749,179.3252 244.08293,244.08293 0 0 0 192.28931,12.793038 Z"/>
  <path fill="url(#outfit)" stroke="#FFFFFF" stroke-width="5.47474"
        d="M 283.32464,18.471579 A 330.76661,330.76661 0 0 0 211.63417,156.44085 330.76661,330.76661 0 0 0 217.7827,336.65055 244.08293,244.08293 0 0 0 309.08124,199.29137 244.08293,244.08293 0 0 0 283.32464,18.471579 Z"/>
  <!-- the outfit's rust trim along the front wing -->
  <path fill="none" stroke="#C6543C" stroke-width="6" stroke-linecap="round"
        d="M 279,40 C 246,92 226,170 224,300"/>

  <!-- the mark on her arm -->
  <g transform="rotate(-8 192 100) translate(186,92)" stroke="#F2EFF4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path transform="translate(0,0)" d="M 8,0 L 1,0 L 0,7 Q 3,5.5 5,6 Q 8,7 8,11 Q 8,16 4,16 Q 1,16 0,13"/>
    <path transform="translate(12,0)" d="M 2,3 L 5,0 L 5,16"/>
  </g>
  <!-- the two leaves below, in the hair's rust -->
  <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="3.64433"
        d="M 3.1326032,310.41929 A 220.1792,220.1792 0 0 0 98.555722,350.50134 220.1792,220.1792 0 0 0 217.7827,336.65055 162.47705,162.47705 0 0 0 121.7011,283.52647 162.47705,162.47705 0 0 0 3.1326032,310.41929 Z"/>
  <path fill="url(#tail)" stroke="#FFFFFF" stroke-width="3.64433"
        d="M 80.650839,503.85583 A 220.1792,220.1792 0 0 0 165.61247,444.74858 220.1792,220.1792 0 0 0 217.7827,336.65055 162.47705,162.47705 0 0 0 121.45529,389.32762 162.47705,162.47705 0 0 0 80.650839,503.85583 Z"/>

  <!-- the head: a face, the hair over its back and its top in bangs, a blush -->
  <use xlink:href="#head" fill="url(#skin)"/>
  <g clip-path="url(#head-clip)">
    <g transform="translate(217.8,336.7) rotate(-26.68)">
      <path fill="url(#hair)"
            d="M -40,-200 L 340,-200 L 340,-40 L 300,-36 L 274,-8 L 258,-32 L 222,-28 L 194,-4 L 178,-30 L 134,-28 L 114,28 L 102,90 L -40,90 Z"/>
      <path fill="none" stroke="#F09070" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"
            d="M 40,-30 C 70,-40 110,-44 150,-40"/>
      <ellipse cx="160" cy="34" rx="15" ry="7" fill="#F28C9C" fill-opacity="0.6"/>
      <ellipse cx="236" cy="34" rx="12" ry="6" fill="#F28C9C" fill-opacity="0.6"/>
    </g>
  </g>
  <use xlink:href="#head" stroke="#FFFFFF" stroke-width="5.47474"/>

  <!-- her mouth, open in a yawn -->
  <g transform="translate(217.8,336.7) rotate(-26.68)">
    <ellipse cx="192" cy="41" rx="6.5" ry="8.5" fill="#6E2626" stroke="#2E1E1E" stroke-width="2.5"/>
    <path fill="#E07070" d="M 186.5,44.5 Q 192,40 197.5,44.5 Q 196,49.5 192,49.5 Q 188,49.5 186.5,44.5 Z"/>
  </g>
  <!-- the black clip in her hair, AF on it -->
  <g transform="translate(217.8,336.7) rotate(-26.68) translate(122,-26) rotate(-24)">
    <rect x="-24" y="-12" width="48" height="24" rx="6" fill="#1C1C20" stroke="#FFFFFF" stroke-width="3"/>
    <g stroke="#FFFFFF" stroke-width="3.20" stroke-linecap="round" stroke-linejoin="round" fill="none"><path transform="translate(-10.00,-6.5) scale(0.812)" d="M 0,16 L 4,0 L 8,16 M 1.6,10 L 6.4,10"/><path transform="translate(-0.25,-6.5) scale(0.812)" d="M 8,0 L 0,0 L 0,16 M 0,8 L 6,8"/></g>
  </g>
  <!-- the eyes, where Wimsy has them, Afugo's: tired, under heavy lids, grey lilac shadows under them -->
  <linearGradient id="lid-0" gradientUnits="userSpaceOnUse" x1="217.78" y1="0" x2="508.05" y2="0" gradientTransform="rotate(26.68) translate(-356.06,-269.04)"><stop offset="0" stop-color="#F7D9CE"/><stop offset="1" stop-color="#FDEDE6"/></linearGradient>
  <linearGradient id="lid-1" gradientUnits="userSpaceOnUse" x1="217.78" y1="0" x2="508.05" y2="0" gradientTransform="rotate(26.68) translate(-424.81,-239.22)"><stop offset="0" stop-color="#F7D9CE"/><stop offset="1" stop-color="#FDEDE6"/></linearGradient>
  <g transform="rotate(24.165289)">
    <circle cx="434.99091" cy="99.701668" r="23.114985" fill="#2E1E1E"/>
    <circle cx="434.99" cy="96.20" r="17.5" fill="url(#iris)"/>
    <circle cx="440.39" cy="103.60" r="3" fill="#FFFFFF" fill-opacity="0.55"/>
    <circle cx="485.51288" cy="44.356552" r="23.114985" fill="#2E1E1E"/>
    <circle cx="485.51" cy="40.86" r="17.5" fill="url(#iris)"/>
    <circle cx="490.91" cy="48.26" r="3" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>
  <clipPath id="eye-clip"><circle r="24.5"/></clipPath>
  <g transform="translate(356.06,269.04) rotate(-26.68)" stroke-linecap="round">
    <path fill="#82728C" fill-opacity="0.55" d="M -21,13 A 25,25 0 0 0 21,13 Q 0,49 -21,13 Z"/>
    <path clip-path="url(#eye-clip)" fill="url(#lid-0)" d="M -30,-40 L 30,-40 L 30,-8 L 23,-8 Q 0,-10 -23,0 L -30,0 Z"/>
    <path stroke="#2E1E1E" stroke-width="4.5" fill="none" d="M -23,0 Q 0,-10 23,-8"/>
  </g>
  <g transform="translate(424.81,239.22) rotate(-26.68)" stroke-linecap="round">
    <path fill="#82728C" fill-opacity="0.55" d="M -21,13 A 25,25 0 0 0 21,13 Q 0,49 -21,13 Z"/>
    <path clip-path="url(#eye-clip)" fill="url(#lid-1)" d="M -30,-40 L 30,-40 L 30,0 L 23,0 Q 0,-10 -23,-8 L -30,-8 Z"/>
    <path stroke="#2E1E1E" stroke-width="4.5" fill="none" d="M -23,-8 Q 0,-10 23,0"/>
  </g>

</svg>
